[package]
name = "qdrant-edge-ffi"
version = "0.3.1"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
log = "0.4"
parking_lot = "0.12"
qdrant-edge = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
